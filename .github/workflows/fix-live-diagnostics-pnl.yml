name: Fix live diagnostics and P&L

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.py')
          s = p.read_text(encoding='utf-8')

          # 1) Add a lightweight all-symbol live price source for continuous P&L marking.
          marker = '''    except Exception:\n        return np.empty((0, 2)), np.empty((0, 2)), source, status, host\n\n\ndef obi(bids, asks, k):'''
          insert = '''    except Exception:\n        return np.empty((0, 2)), np.empty((0, 2)), source, status, host\n\n\n@st.cache_data(ttl=0.8, show_spinner=False)\ndef live_prices():\n    raw, _, _ = api(FUTURES, "/fapi/v1/ticker/price", {})\n    if not isinstance(raw, list):\n        raw, _, _ = api(SPOT, "/api/v3/ticker/price", {})\n    if not isinstance(raw, list):\n        return {}\n    return {str(x.get("symbol")): num(x.get("price")) for x in raw if isinstance(x, dict) and x.get("symbol")}\n\n\ndef obi(bids, asks, k):'''
          if marker in s and 'def live_prices()' not in s:
              s = s.replace(marker, insert, 1)

          # 2) Preserve full ML/OBI/OFI diagnostics in every scanner row.
          old = '''    return {"symbol": symbol, "price": price, "change": change, "signal": signal,\n            "confidence": confidence, "combined": combined, "obi20": f["obi_20"]}'''
          new = '''    return {"symbol": symbol, "price": price, "change": change, "signal": signal,\n            "confidence": confidence, "combined": combined, "obi20": f["obi_20"],\n            "obi5": f["obi_5"], "obi10": f["obi_10"], "obi50": f["obi_50"],\n            "ofi": f["taker_flow_ratio"], "ml_pred": pred, "ml_probability": prob,\n            "ml_status": mlstat, "ml_features": feature_count}'''
          if old in s:
              s = s.replace(old, new, 1)

          # 3) Make each automatically generated scanner record carry the ML diagnostics.
          old = '''                "price": snap["price"], "signal": signal, "confidence": confidence,\n                "entry_price": entry_price, "pnl_pct": pnl_pct, "remaining_sec": remaining,\n                "obi20": snap["obi20"]}'''
          new = '''                "price": snap["price"], "signal": signal, "confidence": confidence,\n                "entry_price": entry_price, "pnl_pct": pnl_pct, "remaining_sec": remaining,\n                "obi20": snap["obi20"], "obi5": snap.get("obi5", 0.0),\n                "obi10": snap.get("obi10", 0.0), "obi50": snap.get("obi50", 0.0),\n                "ofi": snap.get("ofi", 0.0), "ml_pred": snap.get("ml_pred"),\n                "ml_probability": snap.get("ml_probability"), "ml_status": snap.get("ml_status", "—"),\n                "ml_features": snap.get("ml_features", 0)}'''
          if old in s:
              s = s.replace(old, new, 1)

          # 4) Re-mark active scanner rows every fragment tick using live ticker prices.
          old = '''    auto_rows = list(st.session_state.get("auto_scan_rows_map", {}).values())\n\n    df, source, cstat, _ = candles(symbol, TFS[tf], 650)'''
          new = '''    auto_rows = list(st.session_state.get("auto_scan_rows_map", {}).values())\n    prices_live = live_prices()\n    for row in auto_rows:\n        current = prices_live.get(row.get("symbol"))\n        if current and row.get("signal") in ("LONG", "SHORT"):\n            row["price"] = current\n            row["pnl_pct"] = live_signal_pnl(row.get("entry_price", 0.0), current, row.get("signal"))\n\n    df, source, cstat, _ = candles(symbol, TFS[tf], 650)'''
          if old in s and 'prices_live = live_prices()' not in s:
              s = s.replace(old, new, 1)

          # 5) Selected signal: calculate live mark-to-market P&L from its saved entry.
          old = '''    mltext = f"{prob * 100:.2f}%" if prob is not None else "—"\n\n    # Visible countdown'''
          new = '''    mltext = f"{prob * 100:.2f}%" if prob is not None else "—"\n    selected_rec = latest_saved_signal(symbol, tf) if signal in ("LONG", "SHORT") else None\n    selected_entry = selected_rec["entry_price"] if selected_rec else 0.0\n    live_pnl_pct = live_signal_pnl(selected_entry, price, signal) if selected_entry else 0.0\n    live_pnl_text = f"{live_pnl_pct:+.2f}%" if selected_entry else "—"\n\n    # Visible countdown'''
          if old in s and 'live_pnl_pct = live_signal_pnl' not in s:
              s = s.replace(old, new, 1)

          # 6) Put ML + OBI + OFI + live P&L directly in the main signal metadata.
          old = '''                f'<div class="signal-meta">CONFIDENCE {confidence:.1f}% • ML {mltext} • RESEARCH {rscore:+.3f} • COMPOSITE {combined:+.3f}</div>'\n'''
          new = '''                f'<div class="signal-meta">CONFIDENCE {confidence:.1f}% • ML {mltext} ({mlstat}) • OBI5 {f["obi_5"]:+.3f} • OBI20 {f["obi_20"]:+.3f} • OBI50 {f["obi_50"]:+.3f} • OFI {f["taker_flow_ratio"]:+.3f} • LIVE P&L {live_pnl_text} • RESEARCH {rscore:+.3f} • COMPOSITE {combined:+.3f}</div>'\n'''
          if old in s:
              s = s.replace(old, new, 1)

          # 7) Add a live P&L card beside the existing dashboard cards.
          old = '''        ("OBI 50", f"{f['obi_50']:+.3f}", "top 50 depth", "good" if f['obi_50'] >= 0 else "bad"),\n        ("DATA", source, f"book {bsrc}", "cyan"),'''
          new = '''        ("OBI 50", f"{f['obi_50']:+.3f}", "top 50 depth", "good" if f['obi_50'] >= 0 else "bad"),\n        ("OFI", f"{f['taker_flow_ratio']:+.3f}", "live taker flow", "good" if f['taker_flow_ratio'] >= 0 else "bad"),\n        ("LIVE P&L", live_pnl_text, "mark-to-market from signal entry", "good" if live_pnl_pct >= 0 else "bad"),\n        ("DATA", source, f"book {bsrc}", "cyan"),'''
          if old in s:
              s = s.replace(old, new, 1)

          # 8) Scanner rows: show ML state and OBI/OFI diagnostics without changing layout structure.
          old = '''                f'<div style="width:12%">OBI {r["obi20"]:+.3f}</div>'\n                f'<div style="width:14%">conf {r["confidence"]:.1f}%</div>'\n                f'<div style="width:10%">lock {timer}</div>'\n                f'<div style="width:13%;text-align:right"><span class="pill {pill_cls}">{r["signal"]}</span></div>'\n'''
          new = '''                f'<div style="width:12%">OBI {r["obi20"]:+.3f}</div>'\n                f'<div style="width:12%">OFI {r.get("ofi", 0.0):+.3f}</div>'\n                f'<div style="width:16%">ML {((r.get("ml_probability") or 0) * 100):.1f}% • {r.get("ml_status", "—")}</div>'\n                f'<div style="width:12%">conf {r["confidence"]:.1f}%</div>'\n                f'<div style="width:10%">lock {timer}</div>'\n                f'<div style="width:13%;text-align:right"><span class="pill {pill_cls}">{r["signal"]}</span></div>'\n'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate Python syntax
        run: python -m py_compile dashboard.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.py
          if git diff --cached --quiet; then
            echo 'No dashboard changes needed.'
            exit 0
          fi
          git commit -m 'Show live ML diagnostics and refresh P&L'
          git push
