name: Apply initial load scanner fix
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-initial-load-auto-scanner
      - run: python .github/patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git diff --cached --quiet || git commit -m "fix: keep dashboard responsive during auto scan"
          git push origin HEAD:fix-initial-load-auto-scanner
