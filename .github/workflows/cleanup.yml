name: Cleanup auto scan constants
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-auto-scan-constants
      - run: python .github/cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git diff --cached --quiet || git commit -m "fix: remove duplicate auto scan constants"
          git push origin HEAD:cleanup-auto-scan-constants
