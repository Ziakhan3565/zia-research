name: Apply automatic multi-timeframe scanner patch

on:
  push:
    branches: [auto-multi-tf-signal-scanner]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-multi-tf-signal-scanner
      - name: Patch dashboard
        run: python .github/patch_dashboard.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git diff --cached --quiet || git commit -m "feat: auto scan 15M 1H 4H signals with live pnl"
          git push origin HEAD:auto-multi-tf-signal-scanner
